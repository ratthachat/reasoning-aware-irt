[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-aware-irt"
version = "0.1.0"
description = "An extended Item Response Theory for Reasoning Models"
license = { text = "MIT" }
authors = [
  { name="Ratthachat Chatpatanasiri", email="ratthachat.c@gmail.com" },
]

requires-python = ">=3.8"

dependencies = [
"plotly~=5.24.1",
"tqdm~=4.67.1",
"datasets~=4.0.0"
]

[project.urls]
Homepage = "https://github.com/ratthachat/reasoning-aware-irt/"

[tool.setuptools]
packages = ["reasoning_aware_irt"]